<div class="page login-page">
        <div class="container d-flex align-items-center">
            <div class="form-holder has-shadow">
                <div class="row">
                    <!-- Logo & Information Panel-->
                    <div class="col-lg-6">
                        <div class="info d-flex align-items-center">
                            <div class="content">
                                <div class="logo">
                                    <h1>Dashboard</h1>
                                </div>
                                <p>PartyBooking</p>
                            </div>
                        </div>
                    </div>
                    <!-- Form Panel    -->
                    <div class="col-lg-6 bg-white">
                        <div class="form d-flex align-items-center">
                            <div class="content">
                                <form #userlogin="ngForm" (ngSubmit)="onClickSubmit(userlogin.value)" id="loginform"
                                    class="form-validate">
                                    <div class="form-group">
                                        <label for="login-username" class="label-material">Username</label>
                                        <input id="login-username" type="text" name="username" ngModel
                                            #username="ngModel" required data-msg="Please enter your username"
                                            class="input-material">
                                    </div>
                                    <div class="form-group">
                                        <label for="login-password" class="label-material">Password</label>
                                        <input id="login-password" type="password" name="pwd" ngModel required
                                            #pw="ngModel" data-msg="Please enter your password" class="input-material">
                                    </div><button id="login" type="submit" form="loginform"
                                        [disabled]="userlogin.invalid" class="btn btn-primary">Login</button>
                                </form>
                                <!-- <a href="#" class="forgot-pass">Forgot Password?</a><br><small>Do not have an account? </small><a href="register.html" class="signup">Signup</a> -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
